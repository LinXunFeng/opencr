# OpenAI API settings used by the review service.
# OpenAI 配置：用于代码审查调用的大模型服务参数。
openai:
  # Base URL for OpenAI-compatible API endpoint (usually ends with /v1).
  # OpenAI 兼容接口地址（通常以 /v1 结尾）。
  base_url: "https://api.openai.com/v1"
  # API key for model access.
  # 模型服务 API Key。
  api_key: "sk-xxxxxxxx"
  # Model name used for code review requests.
  # 用于代码审查请求的模型名称。
  model: "gpt-4.1"
  # Reasoning effort for supported models: low / medium / high.
  # 支持模型的推理强度：low / medium / high。
  reasoning_effort: "medium"

# Code platform connection settings (currently GitLab-oriented).
# 代码平台连接配置（当前主要面向 GitLab）。
code_platform:
  # Platform type. Keep "gitlab" unless your service explicitly supports others.
  # 平台类型；除非你已扩展实现，否则保持为 gitlab。
  type: "gitlab"
  # Base URL of your GitLab instance.
  # GitLab 实例基础地址。
  url: "https://gitlab.company.com"
  # Access token used to fetch MR changes and post comments.
  # 用于读取 MR Diff 与发表评论的访问令牌。
  token: "glpat-xxxxxxxx"
  # Optional webhook secret token for validating incoming webhook requests.
  # 可选：Webhook 密钥，用于校验请求来源。
  webhook_secret: "replace-with-webhook-secret"

# HTTP server runtime settings.
# 服务运行参数。
server:
  # Bind address for the review server.
  # 服务监听地址。
  host: "0.0.0.0"
  # Bind port for the review server.
  # 服务监听端口。
  port: 9034
  # Log verbosity level: DEBUG / INFO / WARNING / ERROR.
  # 日志级别：DEBUG / INFO / WARNING / ERROR。
  log_level: "INFO"

# Review process behavior controls.
# 审查流程控制参数。
review:
  # Maximum diff size (in characters) processed in one review.
  # 单次审查处理的最大 Diff 字符数。
  max_diff_size: 50000
  # Request timeout for a single review run (in seconds).
  # 单次审查超时时间（秒）。
  timeout: 180
  # Directory containing review skill prompt files.
  # 审查 skill 目录；支持 legacy *.md，也支持标准 name/SKILL.md bundle。
  skills_dir: "skills"
  # Whether executable scripts under a skill's scripts/ directory may add review context.
  # 是否允许执行 skill/scripts/ 下的可执行脚本来补充审查上下文。
  skill_scripts_enabled: true
  # Timeout for each skill script, in seconds.
  # 单个 skill script 的超时时间（秒）。
  skill_scripts_timeout: 10

# Scheduled survey settings: periodically pull whole repositories and analyse them.
# 定期巡检配置：按周期拉取整组仓库的全量代码并做跨仓库整合分析。
survey:
  # Enable the survey scheduler thread.
  # 是否启用巡检调度线程。关闭后已有配置保留，只是不会自动触发。
  enabled: true
  # Root directory holding each survey's local repository copies.
  # Leave empty to use ~/opencr/workspaces.
  # 工作区根目录，存放各巡检的仓库副本；留空则使用 ~/opencr/workspaces。
  # 全量克隆多个仓库可能占用几十 GB，需要放到其它磁盘时改这里。
  workspace_dir: ""
  # How often the scheduler checks for due surveys, in seconds.
  # 调度线程检查到期巡检的间隔（秒）。它只做一次带索引的查询，很轻。
  scheduler_interval_seconds: 60
  # Use codegraph to build structural profiles. Installed by default by both
  # deployment paths; turning this off (or a missing binary) degrades surveys to
  # manifest-level profiles instead of failing them.
  # 是否使用 codegraph 生成仓库画像。两条部署路径都会**默认安装**它。
  # 关掉这个开关（或可执行文件缺失）不会让巡检失败，只会让画像退化为
  # 依赖清单级并记录一条降级 —— 代价是分析时只知道有哪些文件，
  # 不知道有哪些接口与类型。
  codegraph_enabled: true
  # Path or name of the codegraph executable. install.sh writes an absolute path
  # here, because launchd's PATH does not include ~/.local/bin.
  # codegraph 可执行文件路径或名称。install.sh 会在这里写**绝对路径**：
  # launchd 的 PATH 里没有 ~/.local/bin，写裸名会让服务运行时找不到它，
  # 表现为每次巡检都静默降级。
  codegraph_bin: "codegraph"
  # Hard budget for a single survey run. Overridable per survey in the console.
  # 单次巡检的硬预算，可在后台按巡检单独覆盖。
  # 没有预算的话，一个每周自动跑的任务成本可以从几美元浮动到几百美元。
  budget:
    # Wall-clock limit for one run, in minutes. Exceeding it degrades, not fails.
    # 单次运行的墙钟上限（分钟）。超出属于降级而非失败，已产出的结果照常保留。
    wall_clock_minutes: 60
    # Max characters fed into the integration step (all repo profiles combined).
    # 整合分析步骤的输入上限（字符）。默认值据实测标定：
    # 三个中等仓库的组合画像约 43 万字符。
    l1_max_chars: 400000
    # Max number of focus points the integration step may hand to the inspection step.
    # 整合分析最多产出多少个关注点交给取证步骤。
    l2_max_focus: 20
    # Max characters of source read per focus point.
    # 每个关注点最多读取多少字符的源码。
    l2_max_chars_per_focus: 20000
    # Timeout for building one repository's code index, in seconds.
    # 单个仓库建索引的超时时间（秒）。
    index_timeout_seconds: 600
    # Timeout for cloning or fetching one repository, in seconds.
    # 单个仓库克隆/拉取的超时时间（秒）。
    fetch_timeout_seconds: 600

# Admin console settings. Disabled by default.
# 后台管理配置。默认关闭 —— 从旧版本升级上来的实例不会平白多出一个管理面板。
admin:
  # Enable the /admin console and /api/admin/* endpoints.
  # 是否启用 /admin 后台与 /api/admin/* 接口。
  enabled: false
  # Administrator account name. There is exactly one admin account.
  # 管理员用户名。系统只有这一个管理账号，没有用户表也没有角色。
  username: "admin"
  # Password. Write it in PLAIN TEXT here; on first start the service replaces
  # it in place with a scrypt hash and leaves a comment above the line.
  # 密码。**直接写明文**即可：服务首次启动时会就地把它替换成 scrypt 哈希，
  # 并在上方加一行注释。想改密码就把这一行换回明文再重启。
  # 若配置文件不可写（例如只读挂载），服务照常运行，但每次启动都会警告明文未清理。
  password: ""
  # Reject admin requests that do not come from loopback.
  # 是否只允许本机访问后台。Webhook 端口通常内网可达，开启这项可缩小暴露面。
  bind_local_only: false

# Three runtime switches live in the console/database, not in this file:
#   guest_read        browse the console without logging in  (default on)
#   guest_retry       retry a failed run as a guest          (default off)
#   survey_guest_read see the scheduled-survey module        (default on)
# guest_retry and survey_guest_read are both nested under guest_read: with
# browsing off, neither has any effect. survey_guest_read only controls whether
# the module is visible - finding bodies and summaries stay stripped either way.
# 三个运行期开关由后台界面控制，**不在这个文件里**：
#   guest_read        未登录浏览后台        （默认开启）
#   guest_retry       游客重新触发失败运行  （默认关闭）
#   survey_guest_read 游客可见定期巡检模块  （默认开启）
# 后两者都嵌套在 guest_read 之下：浏览关掉时它们都不起作用。
# survey_guest_read 只控制"看不看得到巡检模块"——打开后，发现正文与整合叙述
# 依然会被服务端剔除。
# 三者都存在数据库中、改动立即生效 —— 因为它们的使用场景天然是临时性的
# （"今天有外部人员来，先关一下"），要求改文件加重启就等于没人会用。
# 游客能看到运行状态与聚合统计，但看不到审查发现的正文；
# 完整取舍见 docs/adr/0002-guest-read-scope.md。

# Persistence settings for review history and acceptance statistics.
# 审查历史与采纳统计的持久化配置。
storage:
  # SQLAlchemy database URL. Leave empty to use ~/opencr/data/opencr.db.
  # 数据库连接串；留空则使用 ~/opencr/data/opencr.db。容器内固定为 /app/data/opencr.db。
  database_url: ""
  # Days to keep review runs before the reconciler purges them.
  # 审查记录保留天数，超期由后台任务清理。注意：采纳数据无法回填，清理后不可恢复。
  retention_days: 90
  # A running review with no heartbeat for this long is shown as "stale".
  # 心跳超过该秒数未更新的审查会在后台显示为「疑似中断」。
  # 只标注不改写状态 —— 多进程下无法断言其他进程的审查已死。
  stale_after_seconds: 600
  # Interval of the background reconciler (settles missed merges, purges old data).
  # 后台兜底任务的执行间隔（秒）：结算错过 webhook 的 MR，并清理过期数据。
  reconcile_interval_seconds: 300
