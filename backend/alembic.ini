# Alembic 配置。
# 数据库地址不写在这里 —— 由 migrations/env.py 从 config.yaml / 环境变量解析，
# 避免连接串在两处各存一份。
[alembic]
# 用 %(here)s（本 ini 所在目录）而非相对路径：相对路径是按**当前工作目录**解析的，
# 那样只有 cd 到 backend/ 才能用，从仓库根 `alembic -c backend/alembic.ini` 会找不到。
script_location = %(here)s/migrations
# 仓库根，env.py 需要它才能 import backend.*
prepend_sys_path = %(here)s/..
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
