# 三个挂载点用 docker run 写成一行没人会正确复制，因此提供 compose。
services:
  opencr:
    build: .
    image: opencr:latest
    container_name: opencr
    restart: unless-stopped
    ports:
      - "9034:9034"
    volumes:
      # 配置：必须存在。用长语法 + create_host_path: false，
      # 否则 Docker 会在缺失时自动创建一个名为 config.yaml 的「目录」，
      # 容器随后 crash-loop，而用户 cp 配置时又会拷进那个目录里，极难排查。
      # 刻意**不**设 read_only：首次启动时服务要把 config.yaml 里的明文密码
      # 就地替换成哈希。若你坚持只读挂载，服务仍能正常运行（哈希留在内存里），
      # 但每次启动都会警告明文未清理。
      - type: bind
        source: ./config.yaml
        target: /app/config.yaml
        bind:
          create_host_path: false
      # 审查规则：挂载后整体覆盖镜像内置的默认 skills，
      # 改一条规则不需要重建镜像
      - type: bind
        source: ./skills
        target: /app/skills
        read_only: true
        bind:
          create_host_path: false
      # 数据库：审查历史与采纳统计，删掉等于统计归零
      - opencr-data:/app/data
      - opencr-logs:/app/logs
      # 巡检工作区：各巡检的仓库副本。删掉不丢任何数据（Finding 都在库里），
      # 只是下次巡检要重新全量克隆。全量克隆多个仓库可能占几十 GB，
      # 磁盘紧张时把它换成指向大盘的 bind mount。
      - opencr-workspaces:/app/workspaces
    environment:
      # 容器内固定路径，覆盖 config.yaml 里的默认推导
      OPENCR_DATABASE_URL: sqlite:////app/data/opencr.db
      OPENCR_LOG_FILE: /app/logs/server.log
      OPENCR_SURVEY_WORKSPACE_DIR: /app/workspaces

volumes:
  opencr-data:
  opencr-logs:
  opencr-workspaces:
