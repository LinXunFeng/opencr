# 三个挂载点用 docker run 写成一行没人会正确复制，因此提供 compose。
services:
  opencr:
    build: .
    image: opencr:latest
    container_name: opencr
    restart: unless-stopped
    ports:
      - "9034:9034"
    volumes:
      # 配置：必须存在。用长语法 + create_host_path: false，
      # 否则 Docker 会在缺失时自动创建一个名为 config.yaml 的「目录」，
      # 容器随后 crash-loop，而用户 cp 配置时又会拷进那个目录里，极难排查。
      # 刻意**不**设 read_only：首次启动时服务要把 config.yaml 里的明文密码
      # 就地替换成哈希。若你坚持只读挂载，服务仍能正常运行（哈希留在内存里），
      # 但每次启动都会警告明文未清理。
      - type: bind
        source: ./config.yaml
        target: /app/config.yaml
        bind:
          create_host_path: false
      # 审查规则：挂载后整体覆盖镜像内置的默认 skills，
      # 改一条规则不需要重建镜像
      - type: bind
        source: ./skills
        target: /app/skills
        read_only: true
        bind:
          create_host_path: false
      # 数据库：审查历史与采纳统计，删掉等于统计归零
      - opencr-data:/app/data
      - opencr-logs:/app/logs
      # 巡检工作区：各巡检的仓库副本。删掉不丢任何数据（Finding 都在库里），
      # 只是下次巡检要重新全量克隆。全量克隆多个仓库可能占几十 GB，
      # 磁盘紧张时把它换成指向大盘的 bind mount。
      - opencr-workspaces:/app/workspaces
      # gogcli 的数据目录（可选，仅 Google Sheet 使用 auth: gogcli 时需要）：
      # OAuth 客户端信息与加密后的令牌都在这里。删掉它等于在容器里退出登录。
      - opencr-gogcli:/app/gogcli
      # 巡检输出目标的凭据（可选）：例如 Google Sheet 的服务账号密钥。
      # config.yaml 的 destinations 里写容器内路径 /app/secrets/xxx.json。
      # gogcli 的 OAuth 客户端信息放在 ./secrets/gogcli-client-secret.json，容器每次启动时自动导入；
      # 账号授权仍需首次部署时执行一次 ./scripts/setup-gogcli.sh。
      # - type: bind
      #   source: ./secrets
      #   target: /app/secrets
      #   read_only: true
    environment:
      # 容器内固定路径，覆盖 config.yaml 里的默认推导
      OPENCR_DATABASE_URL: sqlite:////app/data/opencr.db
      OPENCR_LOG_FILE: /app/logs/server.log
      OPENCR_SURVEY_WORKSPACE_DIR: /app/workspaces
      # gogcli：容器里没有系统钥匙串，令牌只能存成加密文件。
      # 密码写在与 docker-compose.yml 同目录的 .env 里（GOG_KEYRING_PASSWORD=...，已在 .gitignore 中），
      # 导入令牌之后不能再改，否则已存的令牌解不开。不用 gogcli 时留空即可；
      # ./scripts/setup-gogcli.sh 会在缺失时自动生成。
      GOG_HOME: /app/gogcli
      GOG_KEYRING_BACKEND: file
      GOG_KEYRING_PASSWORD: ${GOG_KEYRING_PASSWORD:-}

volumes:
  opencr-data:
  opencr-logs:
  opencr-workspaces:
  opencr-gogcli:
